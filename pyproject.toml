[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "breakforge"
version = "1.0.0"
description = "A research framework for causal structural-break detection in univariate time series"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []

[project.urls]
Homepage = "https://github.com/TranTrinhNhan1/BreakForge-A-Research-Framework-for-Causal-Structural-Break-Detection"
Repository = "https://github.com/TranTrinhNhan1/BreakForge-A-Research-Framework-for-Causal-Structural-Break-Detection"

[project.optional-dependencies]
dev = ["pytest>=8.0"]
plot = ["matplotlib>=3.7"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
