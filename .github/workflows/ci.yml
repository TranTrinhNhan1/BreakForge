name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Verify package import
        run: python -c "from structural_break import StructuralBreakDetector, CausalGaussianAR1PIT"
      - name: Run fast and causality tests
        run: python -m pytest -q
      - name: Run synthetic smoke demo
        run: python examples/synthetic_break_demo.py
